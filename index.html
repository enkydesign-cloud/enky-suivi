<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7A1010">
<title>Enky Suivi</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens ---------- */
:root{
  --paper:#faf6f2; --paper2:#f3ecE6; --card:#fffdfb;
  --ink:#241f1c; --ink-soft:#5a5049; --line:#e7dcd2;
  --red:#8a1414; --red2:#b3221f; --red-ink:#5c0d0d;
  --gold:#c08a3e;
  --ok-bg:#e4f0e2; --ok:#2f6b34; --warn-bg:#f7ecd7; --warn:#8a5a00; --bad-bg:#f6e0dd; --bad:#8a1e14; --info-bg:#e6ecf7; --info:#2a4a9c; --grey-bg:#eee7e0; --grey:#6b6058;
  --radius:14px; --shadow:0 10px 30px -12px rgba(60,20,10,.18);
  --font-serif:"Fraunces",Georgia,serif; --font-sans:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);font-size:15px;-webkit-font-smoothing:antialiased}
body{background-image:radial-gradient(circle at 12% 8%, #fff 0%, var(--paper) 55%);}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--font-serif)}
::selection{background:#f0d3c9}
a{color:var(--red2)}

/* ---------- Shell ---------- */
#app{min-height:100vh;display:flex}
aside.side{display:none}
.shell-main{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--red-ink),var(--red2) 65%,var(--gold));color:#fff;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 12px;box-shadow:0 4px 16px rgba(90,15,10,.25)}
header.top img{width:34px;height:34px;background:#fff;border-radius:50%;padding:2px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
header.top h1{font-size:19px;margin:0;flex:1;font-weight:600;letter-spacing:.2px}
header.top .hint{font-family:var(--font-sans);font-size:11.5px;opacity:.85;display:block;margin-top:1px;font-weight:400}
header.top button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:9px;padding:7px 12px;font-size:13px;transition:background .15s}
header.top button:active{background:rgba(255,255,255,.3)}
main{padding:16px 16px 100px;max-width:960px;margin:0 auto;width:100%}
.shell-main header.top-desk{display:none}

/* entrée animée, une seule fois par écran */
main.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards}
main.enter>*:nth-child(1){animation-delay:.02s}main.enter>*:nth-child(2){animation-delay:.07s}
main.enter>*:nth-child(3){animation-delay:.12s}main.enter>*:nth-child(4){animation-delay:.17s}
main.enter>*:nth-child(5){animation-delay:.22s}main.enter>*:nth-child(n+6){animation-delay:.26s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){main.enter>*{animation:none!important}}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fffdfb;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom button{flex:1;background:none;border:0;padding:9px 2px 8px;font-size:11px;color:var(--grey);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;transition:color .15s}
nav.bottom button span{font-size:19px;line-height:1}
nav.bottom button.on{color:var(--red2);font-weight:700}
nav.bottom button.on::before{content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:26px;height:2.5px;background:var(--red2);border-radius:3px}

/* ---------- Cards, KPI ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--red2),var(--gold))}
.kpi b{display:block;font-family:var(--font-serif);font-size:26px;font-weight:600;color:var(--red-ink);line-height:1.15}
.kpi small{color:var(--grey);font-size:12.5px}
h2{font-family:var(--font-serif);font-size:18px;font-weight:600;margin:20px 0 10px;color:var(--red-ink);letter-spacing:.2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--grey-bg);color:var(--grey);white-space:nowrap}
.b-Nouveau{background:var(--info-bg);color:var(--info)}.b-Devis{background:var(--warn-bg);color:var(--warn)}.b-Relancé{background:#fbe3cf;color:#a04400}
.b-Négociation{background:#ece2f7;color:#6d28d9}.b-Gagné{background:var(--ok-bg);color:var(--ok)}.b-Perdu{background:var(--bad-bg);color:var(--bad)}.b-Veille{background:var(--grey-bg);color:var(--grey)}
.b-Brouillon{background:var(--grey-bg);color:var(--grey)}.b-Envoyé{background:var(--warn-bg);color:var(--warn)}.b-Accepté{background:var(--ok-bg);color:var(--ok)}.b-Refusé{background:var(--bad-bg);color:var(--bad)}

.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--red2),var(--gold));color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-weight:600;font-size:15px;flex-shrink:0}

/* ---------- Buttons / forms ---------- */
.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--red2);color:#fff;font-weight:600;box-shadow:0 3px 10px -3px rgba(140,20,20,.5);transition:transform .12s ease,box-shadow .12s ease}
.btn:active{transform:scale(.96);box-shadow:0 1px 4px -1px rgba(140,20,20,.5)}
.btn.alt{background:#fff;color:var(--red2);border:1px solid var(--red2);box-shadow:none}
.btn.sm{padding:7px 11px;font-size:13px}
.btn.grey{background:var(--grey-bg);color:var(--ink);box-shadow:none}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #e0b3ac;box-shadow:none}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid #ddd0c4;border-radius:10px;background:#fff;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red2);box-shadow:0 0 0 3px rgba(179,34,31,.12)}
textarea{min-height:70px}
label{display:block;font-size:12px;color:var(--grey);margin:11px 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px}
.chips button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-size:13px;transition:all .15s}
.chips button.on{background:var(--red2);border-color:var(--red2);color:#fff}
.fab{position:fixed;right:18px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:19;width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--red2),var(--red-ink));color:#fff;font-size:28px;box-shadow:0 8px 22px -6px rgba(140,20,20,.6);transition:transform .15s}
.fab:active{transform:scale(.92) rotate(90deg)}

/* ---------- Sheet / drawer ---------- */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(30,15,10,.45);backdrop-filter:blur(1px);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.panel{background:#fffdfb;width:100%;max-width:720px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:slideUp .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slideUp{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
.panel h3{margin:0 0 4px;font-size:20px;font-family:var(--font-serif);color:var(--red-ink)}
.line{display:grid;grid-template-columns:1fr 60px 100px 34px;gap:6px;margin-bottom:6px;align-items:center}
.tot{background:var(--paper2);border-radius:12px;padding:12px;margin-top:10px;font-size:14px;border:1px solid var(--line)}
.tot div{display:flex;justify-content:space-between;padding:3px 0}.tot .big{font-weight:800;color:var(--red-ink);font-size:16.5px;font-family:var(--font-serif)}
.muted{color:var(--grey);font-size:13px}.over{color:var(--bad);font-weight:700}
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:10px;background:radial-gradient(circle at 50% 0%,#fff,var(--paper) 60%)}
#login img{width:104px;filter:drop-shadow(0 8px 18px rgba(140,20,20,.25))}
#login h2{font-family:var(--font-serif);font-weight:600;color:var(--red-ink)}
#login form{width:100%;max-width:340px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#241f1c;color:#fff;padding:11px 18px;border-radius:11px;z-index:99;max-width:88%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:fadeIn .2s ease}
canvas#pad{border:1.5px dashed #cfa2a2;border-radius:12px;width:100%;height:150px;touch-action:none;background:#fff}
.banner{background:var(--warn-bg);border:1px solid #e0c07f;border-radius:12px;padding:11px 13px;margin-bottom:12px;font-size:13.5px;color:#5c4200}

/* ---------- Desktop layout ---------- */
@media (min-width:900px){
  aside.side{display:flex;flex-direction:column;width:236px;flex-shrink:0;background:linear-gradient(180deg,var(--red-ink),#3d0a0a 85%);color:#fff;min-height:100vh;position:sticky;top:0;padding:22px 16px}
  aside.side .brand{display:flex;align-items:center;gap:10px;margin-bottom:26px}
  aside.side .brand img{width:38px;height:38px;background:#fff;border-radius:50%;padding:2px}
  aside.side .brand b{font-family:var(--font-serif);font-size:17px;font-weight:600}
  aside.side .brand small{display:block;font-size:10.5px;opacity:.75;letter-spacing:.4px}
  aside.side nav{display:flex;flex-direction:column;gap:3px}
  aside.side nav button{display:flex;align-items:center;gap:11px;background:none;border:0;color:rgba(255,255,255,.8);padding:10px 12px;border-radius:10px;font-size:14px;text-align:left;transition:background .15s,color .15s}
  aside.side nav button span{font-size:17px;width:20px;text-align:center}
  aside.side nav button:hover{background:rgba(255,255,255,.08)}
  aside.side nav button.on{background:rgba(255,255,255,.16);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--gold)}
  aside.side .foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.15);font-size:12px;opacity:.8}
  nav.bottom{display:none}
  header.top{display:none}
  .shell-main header.top-desk{position:sticky;top:0;z-index:15;background:rgba(250,246,242,.9);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:16px 28px}
  .shell-main header.top-desk h1{font-family:var(--font-serif);font-size:22px;margin:0;color:var(--red-ink);font-weight:600}
  .shell-main header.top-desk .hint{color:var(--grey);font-size:12.5px}
  main{padding:24px 28px 40px;max-width:1080px}
  .fab{right:32px;bottom:32px}
  .sheet{align-items:center}
  .panel{border-radius:18px;max-width:640px;max-height:88vh;box-shadow:0 30px 70px -20px rgba(40,10,5,.4);animation:pop .18s cubic-bezier(.2,.8,.2,1)}
  @keyframes pop{from{transform:scale(.97) translateY(6px);opacity:.5}to{transform:scale(1) translateY(0);opacity:1}}
  .kpi b{font-size:30px}
  .card:hover{transform:translateY(-2px);box-shadow:0 16px 34px -14px rgba(60,20,10,.28)}
}
</style>
</head>
<body>

<div id="login" hidden>
  <img data-logo alt="Enky Design">
  <h2 style="margin:0">Enky Suivi</h2>
  <form id="loginForm">
    <label>E-mail</label><input id="lemail" type="email" autocomplete="username" required>
    <label>Mot de passe</label><input id="lpass" type="password" autocomplete="current-password" required>
    <p style="margin:14px 0 6px"><button class="btn" style="width:100%">Se connecter</button></p>
    <p class="muted" id="lerr" style="color:#a01818;text-align:center"></p>
    <p style="text-align:center"><a href="#" id="forgot" class="muted">Mot de passe oublié</a></p>
  </form>
</div>

<div id="app" hidden>
  <aside class="side">
    <div class="brand"><img data-logo alt=""><div><b>Enky Suivi</b><small>ENKY&nbsp;DESIGN</small></div></div>
    <nav>
      <button data-act="nav" data-r="home"><span>▦</span>Accueil</button>
      <button data-act="nav" data-r="contacts"><span>☺</span>Prospects &amp; clients</button>
      <button data-act="nav" data-r="docs"><span>▤</span>Devis &amp; proformas</button>
      <button data-act="nav" data-r="settings"><span>⚙</span>Réglages</button>
    </nav>
    <div class="foot" id="sideFoot"></div>
    <button class="btn sm alt" style="margin-top:10px;background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.4)" data-act="logout">Se déconnecter</button>
  </aside>
  <div class="shell-main">
    <header class="top"><img data-logo alt=""><div><h1 id="title">Tableau de bord</h1><span class="hint" id="hintMob"></span></div><button data-act="logout">Quitter</button></header>
    <header class="top-desk"><div><h1 id="titleDesk">Tableau de bord</h1><span class="hint" id="hintDesk"></span></div></header>
    <main id="view"></main>
  </div>
  <nav class="bottom">
    <button data-act="nav" data-r="home"><span>▦</span>Accueil</button>
    <button data-act="nav" data-r="contacts"><span>☺</span>Prospects</button>
    <button data-act="nav" data-r="docs"><span>▤</span>Documents</button>
    <button data-act="nav" data-r="settings"><span>⚙</span>Réglages</button>
  </nav>
</div>
<div id="sheet" class="sheet" hidden><div class="panel" id="panel"></div></div>
<div id="toast" hidden></div>

// ---------- nombre en lettres ----------
function enLettres(n) {
  n = Math.round(n);
  if (n === 0) return "zéro";
  const u = ["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
  const t = ["","","vingt","trente","quarante","cinquante","soixante"];
  const b100 = (n, last) => {
    if (n < 20) return u[n];
    if (n < 70) { const d = Math.floor(n / 10), r = n % 10; return t[d] + (r === 1 ? " et un" : r ? "-" + u[r] : ""); }
    if (n < 80) { const r = n - 60; return "soixante" + (r === 11 ? " et onze" : "-" + u[r]); }
    if (n === 80) return last ? "quatre-vingts" : "quatre-vingt";
    return "quatre-vingt-" + u[n - 80];
  };
  const b1000 = (n, last) => {
    if (n < 100) return b100(n, last);
    const c = Math.floor(n / 100), r = n % 100;
    const s = c === 1 ? "cent" : u[c] + " cent" + (r === 0 && last ? "s" : "");
    return r === 0 ? s : s + " " + b100(r, last);
  };
  const parts = []; const mds = Math.floor(n / 1e9), mil = Math.floor((n % 1e9) / 1e6), k = Math.floor((n % 1e6) / 1e3), r = n % 1e3;
  if (mds) parts.push(b1000(mds, false) + " milliard" + (mds > 1 ? "s" : ""));
  if (mil) parts.push(b1000(mil, false) + " million" + (mil > 1 ? "s" : ""));
  if (k) parts.push(k === 1 ? "mille" : b1000(k, false) + " mille");
  if (r) parts.push(b1000(r, true));
  return parts.join(" ");
}

onAuthStateChanged(auth, u => {
  user = u;
  unsub.forEach(f => f()); unsub = [];
  if (!u) { $("#app").hidden = true; $("#login").hidden = false; return; }
  $("#login").hidden = true; $("#app").hidden = false;
  const err = e => toast("Erreur de synchronisation : " + e.code);
  unsub.push(onSnapshot(collection(db, "contacts"), s => { contacts = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, err));
  unsub.push(onSnapshot(collection(db, "documents"), s => { docs = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, err));
  unsub.push(onSnapshot(doc(db, "settings", "main"), s => { settings = s.exists() ? s.data() : {}; render(); }, err));
  render();
});

// ---------- calculs ----------
function totals(d) {
  const sub = (d.lignes || []).reduce((a, l) => a + num(l.q) * num(l.pu), 0);
  const remise = num(d.remise), base = Math.max(sub - remise, 0);
  const tva = d.tvaOn ? Math.round(base * num(d.tvaTaux) / 100) : 0;
  const total = base + tva;
  return { sub, remise, base, tva, total, acompte: Math.round(total * num(d.acomptePct) / 100) };
}
const waLink = (tel, txt) => {
  let d = String(tel || "").replace(/\D/g, "");
  if (d.length === 9 && d[0] === "6") d = "237" + d;
  return "https://wa.me/" + d + "?text=" + encodeURIComponent(txt);
};

const HINTS = { home: "Vue d'ensemble de votre activité", contacts: "Suivez chaque opportunité jusqu'au paiement", docs: "Vos devis et proformas, prêts à envoyer", settings: "Vos informations, votre signature et vos données" };
function render() {

  document.querySelectorAll("nav.bottom button, aside.side nav button").forEach(b => b.classList.toggle("on", b.dataset.r === route));
  const titles = { home: "Tableau de bord", contacts: "Prospects et clients", docs: "Devis et proformas", settings: "Réglages" };
  $("#title").textContent = titles[route]; $("#titleDesk").textContent = titles[route];
  $("#hintMob").textContent = HINTS[route]; $("#hintDesk").textContent = HINTS[route];
  const foot = $("#sideFoot"); if (foot) foot.innerHTML = `Connecté<br><b style="color:#fff">${esc(user?.email || "")}</b>`;
  const v = $("#view");
  if (route !== render._last) { v.classList.remove("enter"); void v.offsetWidth; v.classList.add("enter"); render._last = route; }
  if (route === "home") v.innerHTML = viewHome();
  else if (route === "contacts") v.innerHTML = viewContacts();
  else if (route === "docs") v.innerHTML = viewDocs();
  else { v.innerHTML = viewSettings(); initPad(); }
}
function viewHome() {
  const actifs = contacts.filter(c => !["Gagné", "Perdu", "En veille"].includes(c.statut));
  const attente = docs.filter(d => d.type === "Devis" && d.statut === "Envoyé");
  const mois = today().slice(0, 7);
  const gagnes = docs.filter(d => d.statut === "Accepté" && (d.date || "").startsWith(mois));
  const relances = contacts.filter(c => c.relance && c.relance <= today() && !["Gagné", "Perdu"].includes(c.statut)).sort((a, b) => a.relance.localeCompare(b.relance));
  const lb = localStorage.getItem("lastBackup");
  const old = !lb || (Date.now() - Number(lb)) > 7 * 864e5;
  const pipe = STATUTS.map(s => ({ s, n: contacts.filter(c => c.statut === s).length }));
  const max = Math.max(1, ...pipe.map(p => p.n));
  return `
  ${old ? `<div class="banner">Pensez à télécharger une sauvegarde de vos données (Réglages, Sauvegarde).</div>` : ""}
  <div class="grid">
    <div class="kpi"><b>${actifs.length}</b><small>Prospects actifs</small></div>
    <div class="kpi"><b>${relances.length}</b><small>À relancer</small></div>
    <div class="kpi"><b>${money(attente.reduce((a, d) => a + totals(d).total, 0))}</b><small>${attente.length} devis en attente</small></div>
    <div class="kpi"><b>${money(gagnes.reduce((a, d) => a + totals(d).total, 0))}</b><small>Acceptés ce mois</small></div>
  </div>
  <h2>À relancer</h2>
  ${relances.length ? relances.map(c => contactCard(c)).join("") : `<div class="card muted">Rien à relancer pour l'instant. Vos prospects en attente apparaîtront ici.</div>`}
  <h2>Pipeline</h2>
  <div class="card">${pipe.map(p => `<div class="row" style="margin:7px 0"><span style="width:104px;font-size:13px">${p.s}</span><div style="flex:1;background:var(--paper2);border-radius:6px;height:14px;overflow:hidden"><div style="width:${p.n / max * 100}%;background:linear-gradient(90deg,var(--red2),var(--gold));height:14px;border-radius:6px;transition:width .6s cubic-bezier(.2,.8,.2,1)"></div></div><b style="width:24px;text-align:right;color:var(--red-ink)">${p.n}</b></div>`).join("")}</div>`;
}
function initials(name) { return (name || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase(); }
function contactCard(c) {
  const late = c.relance && c.relance <= today();
  const msg = `Bonjour ${c.nom || ""}, j'espère que vous allez bien. Avez-vous pu regarder ma proposition${c.besoin ? " concernant " + c.besoin : ""} ? Je reste disponible pour toute question. Enky Design`;
  return `<div class="card">
    <div class="row">
      <div class="avatar">${initials(c.nom)}</div>
      <div style="min-width:0"><b>${esc(c.nom)}</b>${c.entreprise ? `<div class="muted">${esc(c.entreprise)}</div>` : ""}</div>
      <span class="sp"></span><span class="badge ${bcls(c.statut)}">${esc(c.statut)}</span>
    </div>
    <div class="muted" style="margin:8px 0 0">${esc(c.besoin)}${c.budget ? " · " + money(c.budget) : ""}${c.origine === "Partenaire" ? " · via " + esc(c.partenaire) : ""}</div>

function readDocFields() {

function refreshTot() {

  $("#tot").innerHTML = `<div><span>Sous-total</span><span>${money(t.sub)}</span></div>${t.remise ? `<div><span>Remise</span><span>- ${money(t.remise)}</span></div>` : ""}${edit.tvaOn ? `<div><span>TVA ${edit.tvaTaux} %</span><span>${money(t.tva)}</span></div>` : ""}<div class="big"><span>Total</span><span>${money(t.total)}</span></div><div><span>Acompte ${edit.acomptePct} %</span><span>${money(t.acompte)}</span></div>`;

async function saveDoc(thenPdf) {
  readDocFields();
  if (!edit.clientNom) return toast("Indiquez le nom du client.");
  if (!edit.lignes.some(l => l.d && num(l.pu))) return toast("Ajoutez au moins une prestation avec un prix.");
  const d = { ...edit }; const id = d.id; delete d.id;
  try {
    if (!id) {
      const prefix = d.type === "Devis" ? "DEV" : "PRO", yr = d.date.slice(0, 4);
      const cref = doc(db, "counters", prefix + "-" + yr);
      const n = await runTransaction(db, async tx => { const s = await tx.get(cref); const v = (s.exists() ? s.data().n : 0) + 1; tx.set(cref, { n: v }); return v; });
      d.numero = `${prefix}-${yr}-${String(n).padStart(3, "0")}`; d.createdAt = Date.now();
      const ref = await addDoc(collection(db, "documents"), d); d.id = ref.id;
    } else { await setDoc(doc(db, "documents", id), d); d.id = id; }
    closeSheet(); toast("Document enregistré : " + d.numero);
    if (thenPdf) makePdf(d);
  } catch (e) { toast("Échec : " + e.code + " (vérifiez la connexion)"); }
}
async function setDocStatus(id, statut) {
  const d = docs.find(x => x.id === id); if (!d) return;
  try {
    await updateDoc(doc(db, "documents", id), { statut });
    const c = contacts.find(x => x.id === d.contactId);
    if (c && statut === "Envoyé" && d.type === "Devis" && ["Nouveau", "En veille"].includes(c.statut)) await updateDoc(doc(db, "contacts", c.id), { statut: "Devis envoyé", relance: addDays(today(), 3) });
    if (c && statut === "Accepté") await updateDoc(doc(db, "contacts", c.id), { statut: "Gagné", relance: "" });
    if (c && statut === "Refusé") await updateDoc(doc(db, "contacts", c.id), { statut: "Perdu", relance: "" });
  } catch (e) { toast("Échec : " + e.code); }
}

function recuForm(docId) {
  const d = docs.find(x => x.id === docId); if (!d) return;
  const t = totals(d); const paye = (d.paiements || []).reduce((a, p) => a + num(p.montant), 0); const reste = Math.max(t.total - paye, 0);
  edit = { docId, docTotal: t.total, dejaPaye: paye };
  openSheet(`<h3>Reçu de paiement</h3><p class="muted">${esc(d.numero)} — ${esc(d.clientNom)}</p>
  <label>Montant reçu (FCFA)</label><input id="r_montant" inputmode="numeric" value="${reste || t.total}">
  <label>Mode de paiement</label><select id="r_mode"><option>Orange Money</option><option>MTN MoMo</option><option>Virement</option><option>Espèces</option><option>Chèque</option></select>
  <label>Nature du paiement</label><select id="r_nature"><option>Acompte</option><option>Paiement intermédiaire</option><option ${paye > 0 ? "selected" : ""}>Solde final</option><option ${paye === 0 ? "selected" : ""}>Paiement intégral</option></select>
  <label>Date</label><input id="r_date" type="date" value="${today()}">
  <div class="tot" style="margin-top:12px"><div><span>Total du document</span><span>${money(t.total)}</span></div><div><span>Déjà réglé</span><span>${money(paye)}</span></div><div class="big"><span>Reste avant ce paiement</span><span>${money(reste)}</span></div></div>
  <div class="row" style="margin-top:14px"><button class="btn" data-act="saveRecu">Générer le reçu (PDF)</button><button class="btn grey" data-act="closeSheet">Annuler</button></div>`);
}
async function saveRecu() {
  const montant = num($("#r_montant").value); const mode = $("#r_mode").value, nature = $("#r_nature").value, date = $("#r_date").value || today();
  if (!montant) return toast("Indiquez le montant reçu.");
  const d = docs.find(x => x.id === edit.docId); if (!d) return;
  try {
    const yr = date.slice(0, 4); const cref = doc(db, "counters", "REC-" + yr);
    const n = await runTransaction(db, async tx => { const s = await tx.get(cref); const v = (s.exists() ? s.data().n : 0) + 1; tx.set(cref, { n: v }); return v; });
    const numero = `REC-${yr}-${String(n).padStart(3, "0")}`;
    const paiements = [...(d.paiements || []), { numero, date, montant, mode, nature }];
    await updateDoc(doc(db, "documents", d.id), { paiements });
    const t = totals(d); const dejaPaye = paiements.reduce((a, p) => a + num(p.montant), 0); const reste = Math.max(t.total - dejaPaye, 0);
    closeSheet(); toast("Reçu généré : " + numero);
    makeRecuPdf(d, { numero, date, montant, mode, nature }, t.total, dejaPaye, reste);
    if (reste <= 0) setDocStatus(d.id, "Accepté");
  } catch (e) { toast("Échec : " + e.code); }
}
function makeRecuPdf(d, recu, docTotal, dejaPaye, reste) {
  const { jsPDF } = window.jspdf; const p = new jsPDF({ unit: "mm", format: "a4" });
  const RED = [173, 23, 23], INK = [43, 43, 43], GREY = [107, 107, 107], W = 210, M = 15, R = W - M;
  const s = settings;
  try { p.addImage(LOGO, "PNG", M, 9, 22, 22); } catch (e) {}
  p.setFont("helvetica", "bold").setFontSize(17).setTextColor(...RED).text("ENKY DESIGN", M + 26, 19);
  p.setFont("helvetica", "normal").setFontSize(7.5).setTextColor(...GREY).text("Web  |  Design graphique  |  Formation  |  Assistance IT", M + 26, 24.5);
  const hl = ["Douala, Cameroun", s.tel && "Tel / WhatsApp : " + s.tel, s.email].filter(Boolean);
  hl.forEach((l, i) => p.setFontSize(8).text(l, R, 14 + i * 4.2, { align: "right" }));
  p.setDrawColor(...RED).setLineWidth(0.9).line(M, 34, R, 34); p.setDrawColor(...INK).setLineWidth(0.2).line(M, 35.4, R, 35.4);
  p.setFillColor(...RED).rect(M, 40, R - M, 17, "F");
  p.setTextColor(255, 255, 255).setFont("helvetica", "bold").setFontSize(18).text("REÇU DE PAIEMENT", M + 5, 49.5);
  p.setFont("helvetica", "normal").setFontSize(9).text(`N° ${recu.numero}   |   Date : ${fdate(recu.date)}`, M + 5, 54.5);
  let y = 68;
  const rows1 = [["Reçu de", d.clientNom + (d.clientEntreprise ? " (" + d.clientEntreprise + ")" : "")], ["La somme de", money(recu.montant)], ["En lettres", enLettres(recu.montant) + " francs CFA"], ["Mode de paiement", recu.mode], ["Nature du paiement", recu.nature], ["Document concerné", d.numero + " — " + (d.objet || "")]];
  p.autoTable({ startY: y, margin: { left: M, right: M }, theme: "grid", body: rows1,
    styles: { fontSize: 9.5, cellPadding: 3, lineColor: [221, 211, 211], textColor: INK }, columnStyles: { 0: { cellWidth: 48, fillColor: [248, 241, 241], fontStyle: "bold" } } });
  y = p.lastAutoTable.finalY + 8;
  p.setFont("helvetica", "bold").setFontSize(10).setTextColor(...RED).text("Situation du compte", M, y); p.setDrawColor(...RED).line(M, y + 1.5, R, y + 1.5); y += 6;
  const rows2 = [["Montant total du document (TTC)", money(docTotal)], ["Total déjà réglé, y compris ce paiement", money(dejaPaye)], ["Reste à payer", money(reste)]];
  p.autoTable({ startY: y, margin: { left: M, right: M }, theme: "grid", body: rows2, styles: { fontSize: 9.5, cellPadding: 3, lineColor: [221, 211, 211], textColor: INK },
    columnStyles: { 1: { halign: "right" } }, didParseCell: h => { if (h.row.index === 2) { h.cell.styles.fillColor = RED; h.cell.styles.textColor = 255; h.cell.styles.fontStyle = "bold"; } } });
  y = p.lastAutoTable.finalY + 6;
  if (reste <= 0) {
    p.setFillColor(248, 241, 241).rect(M, y, R - M, 14, "F"); p.setDrawColor(...RED).setLineWidth(0.6).rect(M, y, 1.2, 14, "F");
    p.setFont("helvetica", "italic").setFontSize(8.5).setTextColor(...INK);
    const t2 = p.splitTextToSize("Quittance : le présent reçu solde définitivement le document référencé, sous réserve de l'encaissement effectif des sommes.", R - M - 6);
    p.text(t2, M + 4, y + 5.5); y += 18;
  } else y += 6;
  y += 6; p.setFont("helvetica", "bold").setFontSize(9.5).setTextColor(...INK);
  p.text("Pour Enky Design", M, y); p.text("Le client", M + 100, y);
  if (s.signature) { const w = 42; try { p.addImage(s.signature, "PNG", M, y + 2, w, w * (s.sigH || 1) / (s.sigW || 2)); } catch (e) {} }

// ---------- PDF ----------
function makePdf(d) {
  const { jsPDF } = window.jspdf; const p = new jsPDF({ unit: "mm", format: "a4" });
  const RED = [173, 23, 23], INK = [43, 43, 43], GREY = [107, 107, 107], W = 210, M = 15, R = W - M;
  const s = settings, t = totals(d), isPro = d.type === "Proforma";

  try { p.addImage(LOGO, "PNG", M, 9, 22, 22); } catch (e) {}
  p.setFont("helvetica", "bold").setFontSize(17).setTextColor(...RED).text("ENKY DESIGN", M + 26, 19);
  p.setFont("helvetica", "normal").setFontSize(7.5).setTextColor(...GREY).text("Web  |  Design graphique  |  Formation  |  Assistance IT", M + 26, 24.5);
  const hl = ["Douala, Cameroun", s.tel && "Tel / WhatsApp : " + s.tel, s.email, s.web].filter(Boolean);
  hl.forEach((l, i) => p.setFontSize(8).text(l, R, 14 + i * 4.2, { align: "right" }));
  p.setDrawColor(...RED).setLineWidth(0.9).line(M, 34, R, 34); p.setDrawColor(...INK).setLineWidth(0.2).line(M, 35.4, R, 35.4);
  // bandeau
  p.setFillColor(...RED).rect(M, 40, R - M, 17, "F");
  p.setTextColor(255, 255, 255).setFont("helvetica", "bold").setFontSize(18).text(isPro ? "FACTURE PROFORMA" : "DEVIS", M + 5, 49.5);
  p.setFont("helvetica", "normal").setFontSize(9).text(`N° ${d.numero}   |   Date : ${fdate(d.date)}${d.validite ? "   |   Valable " + d.validite + " jours" : ""}`, M + 5, 54.5);
  // parties
  const box = (x, title, lines) => {
    p.setFillColor(...RED).rect(x, 61, 88, 6, "F"); p.setTextColor(255, 255, 255).setFont("helvetica", "bold").setFontSize(9).text(title, x + 3, 65.3);
    p.setDrawColor(221, 211, 211).setLineWidth(0.2).rect(x, 67, 88, 27);
    p.setTextColor(...INK).setFont("helvetica", "normal").setFontSize(8.5); lines.filter(Boolean).slice(0, 6).forEach((l, i) => p.text(String(l), x + 3, 72 + i * 4.3));
  };
  box(M, "Prestataire", ["Enky Design", "Yannick EYINGA NGAH-KOA", "Douala, Cameroun", s.niu && "NIU : " + s.niu, s.regime && "Regime : " + s.regime, s.tel && "Tel : " + s.tel]);
  box(M + 92, isPro ? "Client" : "Client", [d.clientNom, d.clientEntreprise, d.clientAdresse, d.clientTel && "Tel : " + d.clientTel, d.clientNiu && "NIU : " + d.clientNiu]);
  let y = 100;
  if (d.objet) { p.setFont("helvetica", "bold").setFontSize(9.5).setTextColor(...INK); const o = p.splitTextToSize("Objet : " + d.objet, R - M); p.text(o, M, y); y += o.length * 4.6 + 2; }
  p.autoTable({ startY: y, margin: { left: M, right: M }, theme: "grid",
    head: [["N°", "Designation", "Qte", "Prix unitaire (FCFA)", "Total (FCFA)"]],
    body: d.lignes.filter(l => l.d).map((l, i) => [i + 1, l.d, l.q, money(num(l.pu)).replace(" FCFA", ""), money(num(l.q) * num(l.pu)).replace(" FCFA", "")]),
    headStyles: { fillColor: RED, textColor: 255, fontSize: 8.5 }, styles: { fontSize: 8.5, cellPadding: 2.2, lineColor: [221, 211, 211], textColor: INK },
    columnStyles: { 0: { cellWidth: 10, halign: "center" }, 2: { cellWidth: 14, halign: "center" }, 3: { cellWidth: 38, halign: "right" }, 4: { cellWidth: 34, halign: "right" } },
    alternateRowStyles: { fillColor: [248, 241, 241] } });
  y = p.lastAutoTable.finalY + 4;
  const rows = [["Total HT", money(t.sub)]]; if (t.remise) rows.push(["Remise", "- " + money(t.remise)]);
  if (d.tvaOn) rows.push([`TVA ${d.tvaTaux} %`, money(t.tva)]); rows.push([isPro ? "TOTAL TTC" : "TOTAL A PAYER", money(t.total)]);
  if (num(d.acomptePct)) rows.push([`Acompte a verser (${d.acomptePct} %)`, money(t.acompte)]);
  if (y > 240) { p.addPage(); y = 20; }
  p.autoTable({ startY: y, margin: { left: 110, right: M }, theme: "plain", body: rows, styles: { fontSize: 9, cellPadding: 2 }, columnStyles: { 1: { halign: "right" } },
    didParseCell: h => { if (h.row.index === (d.tvaOn ? rows.length - (num(d.acomptePct) ? 2 : 1) : rows.length - (num(d.acomptePct) ? 2 : 1)) && h.section === "body") { h.cell.styles.fillColor = RED; h.cell.styles.textColor = 255; h.cell.styles.fontStyle = "bold"; } } });
  y = p.lastAutoTable.finalY + 6;
  if (isPro) { p.setFont("helvetica", "italic").setFontSize(8.5).setTextColor(...INK); const a = p.splitTextToSize(`Arretee la presente facture proforma a la somme de : ${enLettres(t.total)} francs CFA.`, R - M); p.text(a, M, y); y += a.length * 4 + 3; }
  const block = (title, text) => {
    if (!text) return; const lines = p.splitTextToSize(text, R - M);
    if (y + 8 + lines.length * 4 > 268) { p.addPage(); y = 20; }
    p.setFont("helvetica", "bold").setFontSize(10).setTextColor(...RED).text(title, M, y); p.setDrawColor(...RED).setLineWidth(0.4).line(M, y + 1.5, R, y + 1.5);
    p.setFont("helvetica", "normal").setFontSize(8.5).setTextColor(...INK).text(lines, M, y + 6); y += 9 + lines.length * 4;
  };
  block("Modalites de reglement", s.pay ? "Moyens de paiement : " + s.pay : "");
  block("Conditions", d.cond);
  if (isPro) block("Information", "Cette proforma est un document prealable : elle ne vaut pas facture. La facture definitive est emise apres paiement de l'acompte ou a la livraison.");
  if (y > 248) { p.addPage(); y = 20; }
  y += 4; p.setFont("helvetica", "bold").setFontSize(9.5).setTextColor(...INK);
  p.text("Pour Enky Design", M, y); p.text('Le client ("Bon pour accord")', M + 100, y);
  if (s.signature) { const h = 22, w = Math.min(50, h * (s.sigW || 2) / (s.sigH || 1)); try { p.addImage(s.signature, "PNG", M, y + 2, w, w * (s.sigH || 1) / (s.sigW || 2)); } catch (e) {} }
  p.setFont("helvetica", "normal").setFontSize(8).setTextColor(...GREY).text("Nom, date et signature", M + 100, y + 24);
  const n = p.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    p.setPage(i); p.setDrawColor(...RED).setLineWidth(0.5).line(M, 283, R, 283);
    p.setFont("helvetica", "normal").setFontSize(7).setTextColor(...GREY);
    p.text(`Enky Design - Yannick EYINGA NGAH-KOA - Prestataire digital independant${s.niu ? " - NIU : " + s.niu : ""}`, W / 2, 287, { align: "center" });
    p.text(`Douala, Cameroun${s.email ? "  -  " + s.email : ""}  -  Page ${i} / ${n}`, W / 2, 291, { align: "center" });
  }
  const name = `${d.numero}_${(d.clientNom || "client").replace(/[^\w]+/g, "_")}.pdf`;
  const blob = p.output("blob"), file = new File([blob], name, { type: "application/pdf" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file], title: d.numero }).catch(() => p.save(name)); else p.save(name);
}

// ---------- signature ----------
let drawing = false, pad, pctx, hasInk = false;
function initPad() {
  pad = $("#pad"); if (!pad) return; pctx = pad.getContext("2d"); pctx.lineWidth = 4; pctx.lineCap = "round"; pctx.strokeStyle = "#1a1a5e"; hasInk = false;
  const pos = e => { const r = pad.getBoundingClientRect(), t = e.touches ? e.touches[0] : e; return [(t.clientX - r.left) * pad.width / r.width, (t.clientY - r.top) * pad.height / r.height]; };
  const st = e => { drawing = true; const [x, y] = pos(e); pctx.beginPath(); pctx.moveTo(x, y); e.preventDefault(); };
  const mv = e => { if (!drawing) return; const [x, y] = pos(e); pctx.lineTo(x, y); pctx.stroke(); hasInk = true; e.preventDefault(); };
  const en = () => drawing = false;
  pad.onmousedown = st; pad.onmousemove = mv; window.onmouseup = en; pad.ontouchstart = st; pad.ontouchmove = mv; pad.ontouchend = en;
}
async function saveSignature(dataUrl, w, h) { await setDoc(doc(db, "settings", "main"), { ...settings, signature: dataUrl, sigW: w, sigH: h }); toast("Signature enregistrée."); }

// ---------- Excel / sauvegarde ----------
function exportXlsx() {
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(contacts.map(c => ({ Nom: c.nom, Entreprise: c.entreprise, Telephone: c.tel, Email: c.email, Besoin: c.besoin, Budget: c.budget, Statut: c.statut, Origine: c.origine, Partenaire: c.partenaire, "Prochaine relance": c.relance, Notes: c.notes }))), "Contacts");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(docs.map(d => { const t = totals(d); return { Numero: d.numero, Type: d.type, Date: d.date, Client: d.clientNom, Entreprise: d.clientEntreprise, Objet: d.objet, "Total (FCFA)": t.total, Acompte: t.acompte, Statut: d.statut }; })), "Documents");
  XLSX.writeFile(wb, `Enky_Suivi_${today()}.xlsx`); localStorage.setItem("lastBackup", Date.now());
}
async function importXlsx(file) {
  const wb = XLSX.read(await file.arrayBuffer()), rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
  const g = (r, ...keys) => { for (const k of Object.keys(r)) if (keys.includes(k.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim())) return String(r[k]).trim(); return ""; };
  let n = 0, batch = writeBatch(db);
  for (const r of rows) {
    const nom = g(r, "nom", "name", "client"); if (!nom) continue;
    batch.set(doc(collection(db, "contacts")), { nom, entreprise: g(r, "entreprise", "societe", "company"), tel: g(r, "telephone", "tel", "phone", "whatsapp"), email: g(r, "email", "e-mail", "mail"), besoin: g(r, "besoin", "projet"),
      budget: num(g(r, "budget")) || "", statut: STATUTS.includes(g(r, "statut")) ? g(r, "statut") : "Nouveau", origine: g(r, "origine") === "Partenaire" ? "Partenaire" : "Direct", partenaire: g(r, "partenaire"), relance: g(r, "prochaine relance", "relance"), notes: g(r, "notes"), createdAt: Date.now() + n });
    if (++n % 400 === 0) { await batch.commit(); batch = writeBatch(db); }
  }
  await batch.commit(); toast(n + " contact(s) importé(s).");
}
async function backup() {
  const counters = (await getDocs(collection(db, "counters"))).docs.map(d => ({ id: d.id, ...d.data() }));
  const blob = new Blob([JSON.stringify({ version: 1, date: new Date().toISOString(), contacts, documents: docs, settings, counters })], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `Enky_Sauvegarde_${today()}.json`; a.click(); localStorage.setItem("lastBackup", Date.now()); toast("Sauvegarde téléchargée.");
}
async function restore(file) {
  if (!confirm("Restaurer cette sauvegarde ? Les éléments de même identifiant seront remplacés.")) return;
  const j = JSON.parse(await file.text()); const ops = [];
  (j.contacts || []).forEach(c => { const { id, ...r } = c; ops.push(["contacts", id, r]); }); (j.documents || []).forEach(c => { const { id, ...r } = c; ops.push(["documents", id, r]); });
  (j.counters || []).forEach(c => { const { id, ...r } = c; ops.push(["counters", id, r]); }); if (j.settings) ops.push(["settings", "main", j.settings]);
  for (let i = 0; i < ops.length; i += 400) { const b = writeBatch(db); ops.slice(i, i + 400).forEach(([c, id, r]) => b.set(doc(db, c, id), r)); await b.commit(); }
  toast("Sauvegarde restaurée.");
}

// ---------- événements ----------
const acts = {
  nav: (d) => { route = d.r; render(); scrollTo(0, 0); },
  filter: d => { filter = d.s; render(); },
  logout: () => signOut(auth),
  newContact: () => contactForm({ statut: "Nouveau", origine: "Direct" }),
  editContact: d => contactForm(contacts.find(c => c.id === d.id)),
  saveContact, closeSheet,
  delContact: async () => { if (confirm("Supprimer ce contact ?")) { await deleteDoc(doc(db, "contacts", edit.id)); closeSheet(); toast("Contact supprimé."); } },
  quickDelContact: async d => { if (confirm("Supprimer ce contact ? Cette action est définitive.")) { try { await deleteDoc(doc(db, "contacts", d.id)); toast("Contact supprimé."); } catch (e) { toast("Échec : " + e.code); } } },
  quickDelDoc: async d => { if (confirm("Supprimer ce document ? Cette action est définitive.")) { try { await deleteDoc(doc(db, "documents", d.id)); toast("Document supprimé."); } catch (e) { toast("Échec : " + e.code); } } },
  newRecu: d => recuForm(d.id), saveRecu,
  newDoc: d => newDocFrom(d.id),
  editDoc: d => docForm(docs.find(x => x.id === d.id)),
  addLine: () => { readDocFields(); edit.lignes.push({ d: "", q: 1, pu: "" }); drawLines(); },
  delLine: d => { edit.lignes.splice(+d.i, 1); if (!edit.lignes.length) edit.lignes.push({ d: "", q: 1, pu: "" }); drawLines(); refreshTot(); },
  saveDoc: () => saveDoc(false), saveDocPdf: () => saveDoc(true),
  pdf: d => makePdf(docs.find(x => x.id === d.id)),
  toProforma: d => { const s = docs.find(x => x.id === d.id); const { id, numero, createdAt, ...r } = s; docForm({ ...r, type: "Proforma", statut: "Brouillon", date: today() }); },
  saveSettings: async () => {
    const s = { ...settings, tel: $("#s_tel").value.trim(), email: $("#s_email").value.trim(), web: $("#s_web").value.trim(), niu: $("#s_niu").value.trim(), regime: $("#s_regime").value.trim(), pay: $("#s_pay").value.trim(), cond: $("#s_cond").value, tvaTaux: num($("#s_tva").value) || 19.25 };
    try { await setDoc(doc(db, "settings", "main"), s); toast("Réglages enregistrés."); } catch (e) { toast("Échec : " + e.code); }
  },
  sigClear: () => { pctx.clearRect(0, 0, pad.width, pad.height); hasInk = false; },
  sigSave: async () => { if (!hasInk) return toast("Dessinez d'abord votre signature."); try { await saveSignature(pad.toDataURL("image/png"), pad.width, pad.height); } catch (e) { toast("Échec : " + e.code); } },
  exportXlsx, backup
};
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (el && acts[el.dataset.act]) acts[el.dataset.act](el.dataset, el); });
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.change === "docStatus") setDocStatus(t.dataset.id, t.value);
  if (t.id === "d_contact") { const c = contacts.find(x => x.id === t.value); if (c) { $("#d_nom").value = c.nom || ""; $("#d_ent").value = c.entreprise || ""; $("#d_tel").value = c.tel || ""; if (!$("#d_objet").value) $("#d_objet").value = c.besoin || ""; } }
  if (["d_type", "d_date", "d_remise", "d_acompte", "d_valid", "d_tvat", "d_tvaon"].includes(t.id)) refreshTot();
  if (t.id === "sigFile" && t.files[0]) {
    const img = new Image(); img.onload = async () => { const w = Math.min(500, img.width), h = Math.round(img.height * w / img.width), c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0, w, h); try { await saveSignature(c.toDataURL("image/png"), w, h); } catch (er) { toast("Échec : " + er.code); } }; img.src = URL.createObjectURL(t.files[0]);
  }
  if (t.id === "xlsFile" && t.files[0]) { try { await importXlsx(t.files[0]); } catch (er) { toast("Import impossible : " + er.message); } t.value = ""; }
  if (t.id === "jsonFile" && t.files[0]) { try { await restore(t.files[0]); } catch (er) { toast("Restauration impossible : " + er.message); } t.value = ""; }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.bind === "search") { search = t.value; const pos = t.selectionStart; render(); const n = $("[data-bind=search]"); n.focus(); n.setSelectionRange(pos, pos); }
  if (t.dataset.line !== undefined && edit) { edit.lignes[+t.dataset.line][t.dataset.f] = t.value; refreshTot(); }
  if (["d_remise", "d_acompte", "d_tvat"].includes(t.id)) refreshTot();
});
